<!-- arquivo templates/teste_pdf.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste PDF</title>
</head>
<body>
  <div style="text-align:center; margin-top:50px;">
    <button id="verBtn" class="btn btn-primary">Ver PDF</button>
  </div>
  <div id="viewer" style="display:none; width:100%; height:90vh; margin-top:20px;">
    <iframe src="{{ pdf_url }}#toolbar=1&navpanes=0&view=FitH"
            width="100%" height="100%" frameborder="0">
    </iframe>
  </div>
  <script>
    document.getElementById('verBtn').addEventListener('click', function() {
      var v = document.getElementById('viewer');
      v.style.display = v.style.display === 'none' ? 'block' : 'none';
    });
  </script>
</body>
</html>
