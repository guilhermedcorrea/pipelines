{% extends 'base.html' %}
{% block title %}Login - Peças e Componentes{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h2 class="mb-4">Login</h2>
    <form method="POST" action="{{ url_for('euro.login') }}">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input 
          type="email" 
          name="email" 
          id="email" 
          class="form-control" 
          placeholder="Digite seu email" 
          required
        >
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input 
          type="password" 
          name="senha" 
          id="senha" 
          class="form-control" 
          placeholder="Digite sua senha" 
          required
        >
      </div>
      <button type="submit" class="btn btn-custom w-100">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
