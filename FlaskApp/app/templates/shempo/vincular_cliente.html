{# templates/vincular_cliente.html #}
{% extends "base2.html" %}
{% block title %}Vincular Cliente{% endblock %}
{% block content %}
<h3>Vincular Cliente ao Painel</h3>
<form method="post" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Cliente</label>
    <select name="empresa_id" class="form-select" required>
      {% for e in empresas %}<option value="{{ e.EmpresaID }}">{{ e.NomeEmpresa }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">Painel</label>
    <select name="painel_id" class="form-select" required>
      {% for p in paineis %}<option value="{{ p.PainelID }}">{{ p.Nome }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label">Looping</label>
    <select name="looping" class="form-select" required>
      <option value="2">2 (ocupa 1 coluna)</option>
      <option value="1">1 (ocupa 2 colunas)</option>
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label">Nº Prévia</label>
    <input name="numero_previa" class="form-control">
  </div>
  <div class="col-md-3">
    <label class="form-label">Data Início</label>
    <input type="date" name="data_inicio" class="form-control" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Data Final</label>
    <input type="date" name="data_final" class="form-control" required>
  </div>
  <div class="col-md-2">
    <label class="form-label">ID Usuário (opcional)</label>
    <input name="id_usuario" class="form-control">
  </div>
  <div class="col-12">
    <button class="btn btn-success">Vincular</button>
  </div>
</form>
{% endblock %}
