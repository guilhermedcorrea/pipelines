{% extends "euromidia/base_euromidia.html" %}
{% block title %}Criar Pedido{% endblock %}

{% block content %}
<div class="container-fluid p-2">
  <h2 class="mb-3">Criar Pedido</h2>
  <form method="post" action="{{ url_for('euro.criar_pedido') }}" id="formPedido">
    <!-- Cabeçalho do Pedido -->
    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <label for="referencia_pedido" class="form-label">Referência Pedido</label>
        <input type="text" name="referencia_pedido" id="referencia_pedido" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label for="op_inicial" class="form-label">OP Inicial</label>
        <input type="number" name="op_inicial" id="op_inicial" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label for="id_projeto" class="form-label">ID Projeto</label>
        <input type="number" name="id_projeto" id="id_projeto" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label for="id_empresa_vendedora" class="form-label">ID Empresa Vendedora</label>
        <input type="number" name="id_empresa_vendedora" id="id_empresa_vendedora" class="form-control" required>
      </div>
    </div>
    <!-- Linha para IDEmpresaCompradora -->
    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <label for="id_empresa_compradora" class="form-label">ID Empresa Compradora</label>
        <input type="number" name="id_empresa_compradora" id="id_empresa_compradora" class="form-control" required>
      </div>
    </div>
    <hr>
    <!-- Itens do Pedido -->
    <h4>Itens do Pedido</h4>
    <!-- Template oculto para linha de item -->
    <div class="row g-2 item-row mb-2" id="itemTemplate" style="display: none;">
      <div class="col-md-2">
        <label class="form-label">IDItem</label>
        <input type="number" class="form-control id_item" placeholder="IDItem" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Nome Produto</label>
        <input type="text" class="form-control nome_produto" placeholder="Nome do Produto" readonly>
      </div>
      <div class="col-md-2">
        <label class="form-label">Quantidade</label>
        <input type="number" class="form-control quantidade" placeholder="Quantidade" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Valor Unitário</label>
        <input type="number" step="0.01" class="form-control valor" placeholder="Valor" required>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button type="button" class="btn btn-danger remove-item">&times;</button>
      </div>
    </div>
    <!-- Container para itens clonados -->
    <div id="itensList"></div>
    <button type="button" class="btn btn-success mb-3" id="addItemBtn">+ Adicionar Item</button>
    <button type="submit" class="btn btn-primary">Criar Pedido</button>
  </form>
</div>

<script>
  // Função para buscar o nome do produto via fetch
  function fetchNomeProdutoForRow(row) {
    const idInput = row.querySelector('.id_item');
    const nomeInput = row.querySelector('.nome_produto');
    const idValue = idInput.value.trim();
    if (!idValue) {
      nomeInput.value = '';
      return;
    }
    fetch(`/get_nome_produto/${idValue}`)
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro na resposta: ' + response.status);
        }
        return response.json();
      })
      .then(data => {
        nomeInput.value = data.nome || '';
      })
      .catch(error => {
        console.error('Erro ao buscar NomeProduto:', error);
        nomeInput.value = '';
      });
  }

  // Adiciona os eventos: buscar nome ao sair do campo e remover item
  function addEventsToRow(row) {
    const idInput = row.querySelector('.id_item');
    idInput.addEventListener('blur', () => fetchNomeProdutoForRow(row));
    row.querySelector('.remove-item').addEventListener('click', () => row.remove());
  }

  document.addEventListener('DOMContentLoaded', () => {
    const addItemBtn = document.getElementById('addItemBtn');
    const itensList = document.getElementById('itensList');
    const template = document.getElementById('itemTemplate');

    // Ao clicar, clona o template, limpa os campos e adiciona eventos à nova linha
    addItemBtn.addEventListener('click', () => {
      const clone = template.cloneNode(true);
      clone.style.display = 'flex';
      clone.removeAttribute('id'); // Remove o ID para evitar duplicidade
      clone.querySelectorAll('input').forEach(input => input.value = '');
      addEventsToRow(clone);
      itensList.appendChild(clone);
    });

    // Adiciona uma linha inicial
    addItemBtn.click();

    // Trata o submit: coleta itens válidos e insere inputs hidden antes de submeter
    const form = document.getElementById('formPedido');
    form.addEventListener('submit', (e) => {
      e.preventDefault(); // Evita o submit imediato
      const itemRows = document.querySelectorAll('#itensList .item-row');
      let validItems = [];
      itemRows.forEach(row => {
        const id_item = row.querySelector('.id_item').value.trim();
        const quantidade = row.querySelector('.quantidade').value.trim();
        const valor = row.querySelector('.valor').value.trim();
        if (id_item !== "" && quantidade !== "" && valor !== "") {
          validItems.push({
            id_item: id_item,
            nome_produto: row.querySelector('.nome_produto').value.trim(),
            quantidade: quantidade,
            valor: valor
          });
        }
      });
      console.log("Itens válidos:", validItems);
      if (validItems.length === 0) {
        alert("Por favor, informe pelo menos um item válido.");
        return;
      }
      // Remove inputs hidden existentes, se houver
      document.querySelectorAll('input[name="lines[]"]').forEach(input => input.remove());
      validItems.forEach(item => {
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = 'lines[]';
        hiddenInput.value = JSON.stringify(item);
        form.appendChild(hiddenInput);
      });
      form.submit(); // Submete o formulário com os inputs preparados
    });
  });
</script>
{% endblock %}
