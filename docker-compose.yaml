x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: ${AIRFLOW_IMAGE_NAME}
  env_file:
    - ./.env

  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo

    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1

    AIRFLOW__CELERY__WORKER_CONCURRENCY: 1
    AIRFLOW__SCHEDULER__TASK_QUEUED_TIMEOUT: 3600

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
   

    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    
    AIRFLOW__FAB__NAVBAR_COLOR: "#554189"
    AIRFLOW__FAB__NAVBAR_TEXT_COLOR: "#ffffff"
    AIRFLOW__FAB__NAVBAR_HOVER_COLOR: "#6a52a8"
    AIRFLOW__FAB__NAVBAR_TEXT_HOVER_COLOR: "#ffffff"

    TZ: America/Sao_Paulo
    PYTHONPATH: /opt/airflow:/opt/airflow/src

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/queries:/opt/airflow/queries
    - ./airflow/Dados:/opt/airflow/Dados
    - ./airflow/Artefatos:/opt/airflow/Artefatos
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./airflow/simple_auth:/opt/airflow/simple_auth
    - ./airflow/src:/opt/airflow/src
    - ./airflow/sharepoint_teste:/opt/airflow/sharepoint_teste
    - "/run/desktop/mnt/host/c/CargaSQL/Euromidia/Contratos:/opt/airflow/Dados/Euromidia/Comercial/CargasSQL"

  user: "${AIRFLOW_UID}:0"

  extra_hosts:
    - "host.docker.internal:host-gateway"

  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy


services:
  postgres:
    image: postgres:16
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    restart: unless-stopped

  flask-app:
    build:
      context: ./FlaskApp
      dockerfile: Dockerfile
    image: flaskapp-guilherme:latest
    env_file:
      - ./.env
    environment:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx-flask:
    image: nginx:1.27-alpine
    depends_on:
      flask-app:
        condition: service_started
    ports:
      - "5000:80"
    volumes:
      - ./FlaskApp/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped


volumes:
  postgres-db-volume: