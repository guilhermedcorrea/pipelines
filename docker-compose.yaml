x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: ${AIRFLOW_IMAGE_NAME}
  env_file:
    - ./.env

  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo

    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1

    AIRFLOW__CELERY__WORKER_CONCURRENCY: 1
    AIRFLOW__SCHEDULER__TASK_QUEUED_TIMEOUT: 3600

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Hostname estável para as TaskInstances e servidor interno de logs do Airflow.
    # Sem isso, o Airflow pode tentar ler logs em http://:8793/log/... quando o hostname fica vazio/inválido.
    AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.getfqdn
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: "8793"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    AIRFLOW__FAB__NAVBAR_COLOR: "#554189"
    AIRFLOW__FAB__NAVBAR_TEXT_COLOR: "#ffffff"
    AIRFLOW__FAB__NAVBAR_HOVER_COLOR: "#6a52a8"
    AIRFLOW__FAB__NAVBAR_TEXT_HOVER_COLOR: "#ffffff"

    TZ: America/Sao_Paulo

    # Backups SQL Server - a mesma pasta precisa estar montada no Airflow
    # e existir no host/container onde o SQL Server grava os .bak/.trn.
    BACKUP_SQLSERVER_MANUAL_DIR: /var/opt/mssql/backups/manual
    BACKUP_FILESYSTEM_BACKEND: airflow
    BACKUP_MOVER_INVALIDOS: "1"

    PYTHONPATH: /opt/airflow:/opt/airflow/src:/opt/airflow/plugins:/opt/airflow/dags
    CAMINHO_STATIC_FLASK: /opt/airflow/FlaskApp/app/static
    CAMINHO_BASE_FLASK_APP: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp

    # DAG de mensageria chama o Nginx interno, e o Nginx distribui para as 2 instâncias Flask.
    FLASK_MENSAGERIA_NOTIFICAR_URL: http://nginx-flask/admin/api/mensagens/notificar
    MENSAGERIA_SOCKET_TOKEN: ${MENSAGERIA_SOCKET_TOKEN}

    # Rclone / SharePoint - BaseDados
    # Remote confirmado no servidor: sharepoint_basedados:
    # Pasta correta no SharePoint/rclone: 01- Controle de Contratos
    # Arquivo correto no SharePoint/rclone: Copia-Controle de Contratos Euromidia.xlsm
    # Fluxo correto: o DAG baixa o arquivo atualizado do SharePoint antes de ler no pandas.
    RCLONE_CONFIG: /opt/airflow/config/rclone/rclone.conf
    RCLONE_REMOTE_CONTROLE_CONTRATOS: "sharepoint_basedados"
    RCLONE_PASTA_CONTROLE_CONTRATOS: "01- Controle de Contratos"
    NOME_ARQUIVO_EXCEL_CONTROLE_CONTRATOS: "Copia-Controle de Contratos Euromidia.xlsm"
    RCLONE_ARQUIVO_ORIGEM_CONTROLE_CONTRATOS: "sharepoint_basedados:01- Controle de Contratos/Copia-Controle de Contratos Euromidia.xlsm"
    SHAREPOINT_BASEDADOS_DIR: "sharepoint_basedados:01- Controle de Contratos"
    SHAREPOINT_BASEDADOS_ARQUIVO_DISPONIBILIDADE: "sharepoint_basedados:01- Controle de Contratos/Copia-Controle de Contratos Euromidia.xlsm"
    CAMINHO_LOCAL_SHAREPOINT_BASEDADOS: "/home/euromidia/projetos/pipelines/airflow/01- Controle de Contratos"
    PASTA_BASE_DADOS_CONTRATOS_CONTAINER: "/home/euromidia/projetos/pipelines/airflow/01- Controle de Contratos"
    CAMINHO_CONTROLE_CONTRATOS_XLSM: "/home/euromidia/projetos/pipelines/airflow/01- Controle de Contratos/Copia-Controle de Contratos Euromidia.xlsm"

    # PDFs de contratos D4Sign.
    # O DAG grava/atualiza a tabela FatoArquivosContratosEuromidia e salva o PDF físico nesta pasta.
    # Esta pasta precisa ser o MESMO bind mount usado/servido pelo Flask para o botão de download encontrar o arquivo.
    D4SIGN_PDF_LOCAL_PASTA_CONTRATO: /home/euromidia/projetos/pipelines/FlaskApp/Contratos/Euromidia/Anexos/Contrato
    D4SIGN_GARANTIR_PDF_LOCAL_DAGS_HABILITADO: "1"
    D4SIGN_GARANTIR_PDF_LOCAL_LIMITE_POR_EXECUCAO: "5000"
    D4SIGN_GARANTIR_PDF_LOCAL_VERIFICAR_FISICO_TODOS: "1"

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/queries:/opt/airflow/queries
    - ./airflow/Dados:/opt/airflow/Dados:rw
    - /home/euromidia/projetos/pipelines/airflow/01- Controle de Contratos:/home/euromidia/projetos/pipelines/airflow/01- Controle de Contratos:rw
    # IMPORTANTE:
    # Não monte uma pasta específica por cima de /opt/airflow/Dados/SharePoint/...
    # O DAG grava o arquivo atualizado do SharePoint dentro do volume raiz /opt/airflow/Dados,
    # que no host aparece em /root/PythonJobs/pipelines/airflow/Dados.
    - ./airflow/Artefatos:/opt/airflow/Artefatos
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    # Backups SQL Server: monta no Airflow o mesmo caminho usado pelo SQL Server.
    - /var/opt/mssql/backups/manual:/var/opt/mssql/backups/manual:rw
    # IMPORTANTE:
    # O rclone.conf deve ficar em ./airflow/config/rclone/rclone.conf no host.
    # Não use bind mount somente leitura para esse arquivo, porque o rclone precisa
    # criar arquivo temporário e atualizar token/config quando necessário.
    - ./airflow/simple_auth:/opt/airflow/simple_auth
    - ./airflow/src:/opt/airflow/src
    - ./airflow/sharepoint_teste:/opt/airflow/sharepoint_teste
    - ./FlaskApp/app/static:/opt/airflow/FlaskApp/app/static:ro
    # IMPORTANTE:
    # Não monte /opt/airflow/Dados/Euromidia/Comercial/CargasSQL em outro caminho.
    # Isso desviaria os CSVs para fora de /root/PythonJobs/pipelines/airflow/Dados.
    - ./FlaskApp/chekin:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin:rw
    - ./FlaskApp/paineis:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/paineis:rw
    # PDFs/anexos de contratos D4Sign.
    # Montagem no caminho real do servidor para o Airflow gravar exatamente onde você verifica no host.
    - /home/euromidia/projetos/pipelines/FlaskApp/Contratos:/home/euromidia/projetos/pipelines/FlaskApp/Contratos:rw
    # Montagem também no caminho legado usado por partes antigas do projeto, sem remover compatibilidade.
    - /home/euromidia/projetos/pipelines/FlaskApp/Contratos:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/Contratos:rw

  user: "${AIRFLOW_UID}:0"

  extra_hosts:
    - "host.docker.internal:host-gateway"

  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-flask-common: &flask-common
  build:
    context: ./FlaskApp
    dockerfile: Dockerfile
  image: flaskapp-guilherme:latest
  env_file:
    - ./.env
  environment:
    TZ: America/Sao_Paulo
    PYTHONUNBUFFERED: "1"

    CACHE_REDIS_URL: redis://redis:6379/2
    SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
    SOCKETIO_CHANNEL: flaskapp_socketio
    RATELIMIT_STORAGE_URI: redis://redis:6379/4

    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CELERY_QUEUE_CONTRATOS_ANEXOS: contratos_anexos
    CHECKING_PASTA_TEMP: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin/_temp
    PASTA_RELATORIOS_OCUPACAO: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/relatorios/ocupacao
    PASTA_BASE_CHECKIN: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/paineis/pontos
    PASTA_ANEXOS_CONTRATOS_EUROMIDIA: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/Contratos/Euromidia/Anexos/Contrato
    PASTA_TEMP_ANEXOS_CONTRATOS_EUROMIDIA: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/Contratos/Euromidia/Anexos/_temp
    EXTENSOES_PERMITIDAS_ANEXOS_CONTRATOS: xlsm,csv,xlsx,pdf,jpg,jpeg,png,img,gif,bmp,webp,tif,tiff,heic,heif,svg

    MENSAGERIA_SOCKET_TOKEN: ${MENSAGERIA_SOCKET_TOKEN}
  command: >
    gunicorn
    --bind 0.0.0.0:8000
    --workers 6
    --worker-class gthread
    --threads 20
    --timeout 180
    --graceful-timeout 30
    --keep-alive 15
    --access-logfile -
    --error-logfile -
    --log-level info
    --capture-output
    --worker-tmp-dir /dev/shm
    --max-requests 1500
    --max-requests-jitter 200
    wsgi:app
  shm_size: "512mb"
  expose:
    - "8000"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - ./FlaskApp/chekin:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin
    - ./FlaskApp/paineis:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/paineis
    - ./FlaskApp/relatorios:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/relatorios
    - /home/euromidia/projetos/pipelines/FlaskApp/Contratos:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/Contratos:rw
    - ./FlaskApp/app/static:/app/app/static
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/api/v2/monitor/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    # Hostname fixo para o Airflow gravar um endereço resolvível nas TaskInstances.
    # O api-server/webserver usa esse hostname para buscar logs servidos pelo worker na porta 8793.
    hostname: airflow-worker
    command: celery worker
    expose:
      - "8793"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Instância Flask 1.
  # Usa 4 workers gthread por container. Socket.IO permanece compatível com async_mode=threading e Redis message_queue.
  flask-app-1:
    <<: *flask-common

  # Instância Flask 2.
  # Segunda instância Flask com a mesma configuração: 4 workers gthread por container.
  flask-app-2:
    <<: *flask-common

  celery-checking-worker:
    build:
      context: ./FlaskApp
      dockerfile: Dockerfile
    image: flaskapp-guilherme:latest
    env_file:
      - ./.env
    environment:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"

      CACHE_REDIS_URL: redis://redis:6379/2
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
      SOCKETIO_CHANNEL: flaskapp_socketio
      RATELIMIT_STORAGE_URI: redis://redis:6379/4

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHECKING_PASTA_TEMP: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin/_temp
      PASTA_BASE_CHECKIN: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/paineis/pontos
      MENSAGERIA_SOCKET_TOKEN: ${MENSAGERIA_SOCKET_TOKEN}
    command: python -m celery -A app.celery_app.celery_app worker -Q checkin_upload -l info --concurrency=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      flask-app-1:
        condition: service_started
      flask-app-2:
        condition: service_started
    volumes:
      - ./FlaskApp/chekin:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin
      - ./FlaskApp/paineis:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/paineis
      - ./FlaskApp/app/static:/app/app/static
    restart: unless-stopped

  celery-kanban-worker:
    build:
      context: ./FlaskApp
      dockerfile: Dockerfile
    image: flaskapp-guilherme:latest
    env_file:
      - ./.env
    environment:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"

      CACHE_REDIS_URL: redis://redis:6379/2
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
      SOCKETIO_CHANNEL: flaskapp_socketio
      RATELIMIT_STORAGE_URI: redis://redis:6379/4

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHECKING_PASTA_TEMP: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin/_temp
      MENSAGERIA_SOCKET_TOKEN: ${MENSAGERIA_SOCKET_TOKEN}
    command: python -m celery -A app.celery_app.celery_app worker -Q kanban_retry_rapido -l info --concurrency=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      flask-app-1:
        condition: service_started
      flask-app-2:
        condition: service_started
    volumes:
      - ./FlaskApp/chekin:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin
      - ./FlaskApp/app/static:/app/app/static
    restart: unless-stopped


  celery-clientes-worker:
    build:
      context: ./FlaskApp
      dockerfile: Dockerfile
    image: flaskapp-guilherme:latest
    env_file:
      - ./.env
    environment:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"

      CACHE_REDIS_URL: redis://redis:6379/2
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
      SOCKETIO_CHANNEL: flaskapp_socketio
      RATELIMIT_STORAGE_URI: redis://redis:6379/4

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHECKING_PASTA_TEMP: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin/_temp
      MENSAGERIA_SOCKET_TOKEN: ${MENSAGERIA_SOCKET_TOKEN}
    command: python -m celery -A app.celery_app.celery_app worker -Q clientes_cache -l info --concurrency=4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      flask-app-1:
        condition: service_started
      flask-app-2:
        condition: service_started
    volumes:
      - ./FlaskApp/chekin:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin
      - ./FlaskApp/app/static:/app/app/static
    restart: unless-stopped

  celery-paineis-worker:
    build:
      context: ./FlaskApp
      dockerfile: Dockerfile
    image: flaskapp-guilherme:latest
    env_file:
      - ./.env
    environment:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"

      CACHE_REDIS_URL: redis://redis:6379/2
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
      SOCKETIO_CHANNEL: flaskapp_socketio
      RATELIMIT_STORAGE_URI: redis://redis:6379/4

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHECKING_PASTA_TEMP: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin/_temp
      PASTA_RELATORIOS_OCUPACAO: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/relatorios/ocupacao
      MENSAGERIA_SOCKET_TOKEN: ${MENSAGERIA_SOCKET_TOKEN}
    command: python -m celery -A app.celery_app.celery_app worker -Q paineis_ocupacao -l info --concurrency=3 --prefetch-multiplier=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      flask-app-1:
        condition: service_started
      flask-app-2:
        condition: service_started
    volumes:
      - ./FlaskApp/chekin:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin
      - ./FlaskApp/paineis:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/paineis
      - ./FlaskApp/relatorios:/home/guilherme_correa/PythonJobs/pipelines/FlaskApp/relatorios
      - ./FlaskApp/app/static:/app/app/static
    restart: unless-stopped

  celery-contratos-worker:
    build:
      context: ./FlaskApp
      dockerfile: Dockerfile
    image: flaskapp-guilherme:latest
    env_file:
      - ./.env
    environment:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"

      CACHE_REDIS_URL: redis://redis:6379/2
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
      SOCKETIO_CHANNEL: flaskapp_socketio
      RATELIMIT_STORAGE_URI: redis://redis:6379/4

      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_QUEUE_CONTRATOS_DETALHE: contratos_detalhe
      CHECKING_PASTA_TEMP: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/chekin/_temp
      PASTA_RELATORIOS_OCUPACAO: /home/guilherme_correa/PythonJobs/pipelines/FlaskApp/relatorios/ocupacao
      MENSAGERIA_SOCKET_TOKEN: ${MENSAGERIA_SOCKET_TOKEN}
    command: python -m celery -A app.celery_app.celery_app worker -Q contratos_detalhe -l info --concurrency=4 --prefetch-multiplier=1 --max-tasks-per-child=200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      flask-app-1:
        condition: service_started
      flask-app-2:
        condition: service_started
    volumes:
